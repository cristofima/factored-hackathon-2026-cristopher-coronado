name: Data CI

on:
  push:
    branches: ["main", "develop", "feature/*", "refactor/*"]
    paths:
      - "app/business-api/data/**"
      - "!app/business-api/data/**/*.md"
      - ".github/workflows/data-ci.yml"
  pull_request:
    branches: ["main", "develop"]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "app/business-api/data/**"
      - "!app/business-api/data/**/*.md"
      - ".github/workflows/data-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build-and-test:
    name: Build & Test (data)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: app/business-api/data

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          save-cache: true
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --dev --frozen --no-build

      - name: Compile check (syntax)
        run: uv run --frozen --no-sync --no-build python -m compileall -q .

      - name: Run tests
        run: uv run --frozen --no-sync --no-build pytest -q tests --junitxml=junit.xml

      - name: Upload test and coverage artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: data-test-results
          path: |
            app/business-api/data/junit.xml
            app/business-api/data/coverage.xml
          retention-days: 14
          if-no-files-found: ignore

      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('app/business-api/data/coverage.xml') != '' }}
        continue-on-error: true
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: app/business-api/data/coverage.xml
          format: markdown
          output: both

      - name: Add coverage summary to job summary
        if: ${{ !cancelled() && hashFiles('app/business-api/data/coverage.xml') != '' }}
        continue-on-error: true
        run: cat code-coverage-results.md >> "$GITHUB_STEP_SUMMARY"

      - name: Test report
        if: ${{ !cancelled() && github.event_name == 'push' }}
        uses: dorny/test-reporter@v3.0.0
        with:
          name: "Data Pytest Results"
          path: app/business-api/data/junit.xml
          reporter: python-xunit
