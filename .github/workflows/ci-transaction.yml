name: Transaction CI

on:
  push:
    branches: ["main", "develop", "feature/*", "refactor/*", "fix/*"]
    paths:
      - "app/business-api/transaction/**"
      - "!app/business-api/transaction/**/*.md"
      - "app/business-api/shared/**"
      - ".github/workflows/ci-transaction.yml"
      - ".github/actions/ci-python/**"
  pull_request:
    branches: ["main", "develop"]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "app/business-api/transaction/**"
      - "!app/business-api/transaction/**/*.md"
      - "app/business-api/shared/**"
      - ".github/workflows/ci-transaction.yml"
      - ".github/actions/ci-python/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build-and-test:
    name: Build & Test (transaction)
    runs-on: ubuntu-latest
    env:
      PYTEST_ADDOPTS: "--ignore=tests/test_consent_postgres.py"
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/ci-python
        with:
          project-path: app/business-api/transaction
          artifact-name: transaction-test-results
          deployment-requirements: requirements.txt
          run-tests: "true"
