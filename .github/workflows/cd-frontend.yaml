name: Deploy Frontend

on:
  push:
    branches:
      - main
    paths:
      - "app/frontend/banking-web/**"
      - "!app/frontend/banking-web/**/*.md"
      - ".github/workflows/cd-frontend.yaml"
      - ".github/actions/cd-azure/**"
      - "azure.yaml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Development
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/cd-azure
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          location: ${{ vars.AZURE_LOCATION }}
          resource-group: ${{ vars.AZURE_RESOURCE_GROUP }}
          app-service-name: ${{ vars.AZURE_WEB_APP_NAME }}
          app-service-name-variable: AZURE_WEB_APP_NAME
      - name: Configure frontend build-time environment
        # CI never provisions, so the root azure.yaml postprovision hook (which derives these
        # from Terraform outputs) never runs here; set the same VITE_* keys directly so Vite
        # bakes the real backend URLs at build time instead of falling back to .env.local defaults.
        env:
          VITE_ACCOUNT_API_URL: ${{ vars.VITE_ACCOUNT_API_URL }}
          VITE_TRANSACTION_API_URL: ${{ vars.VITE_TRANSACTION_API_URL }}
          VITE_RESPONSES_BFF_URL: ${{ vars.VITE_RESPONSES_BFF_URL }}
          VITE_RESPONSES_API_URL: ${{ vars.VITE_RESPONSES_API_URL }}
        run: |
          set -euo pipefail
          for var in VITE_ACCOUNT_API_URL VITE_TRANSACTION_API_URL VITE_RESPONSES_BFF_URL VITE_RESPONSES_API_URL; do
            if [ -z "${!var}" ]; then
              echo "::error::Missing required GitHub environment variable: $var"
              exit 1
            fi
            azd env set "$var" "${!var}"
          done
      - name: Deploy frontend
        run: azd deploy web --no-prompt
