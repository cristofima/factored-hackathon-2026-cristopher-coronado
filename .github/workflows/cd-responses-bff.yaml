name: Deploy Responses BFF

on:
  push:
    branches:
      - main
    paths:
      - "app/responses-bff/**"
      - "!app/responses-bff/**/*.md"
      - "app/business-api/shared/**"
      - ".github/workflows/cd-responses-bff.yaml"
      - ".github/actions/cd-azure/**"
      - ".github/actions/appservice-preflight/**"
      - "azure.yaml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Development
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/cd-azure
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          location: ${{ vars.AZURE_LOCATION }}
          resource-group: ${{ vars.AZURE_RESOURCE_GROUP }}
          app-service-name: ${{ vars.AZURE_RESPONSES_BFF_APP_NAME }}
          app-service-name-variable: AZURE_RESPONSES_BFF_APP_NAME
      - uses: ./.github/actions/appservice-preflight
        with:
          service: responses-bff
          app-name: ${{ vars.AZURE_RESPONSES_BFF_APP_NAME }}
          resource-group: ${{ vars.AZURE_RESOURCE_GROUP }}
      - name: Deploy Responses BFF
        run: azd deploy responses-bff --no-prompt
