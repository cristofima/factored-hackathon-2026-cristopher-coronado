name: Deploy Transaction API

on:
  push:
    branches:
      - main
    paths:
      - "app/business-api/transaction/**"
      - "!app/business-api/transaction/**/*.md"
      - ".github/workflows/cd-transaction.yaml"
      - ".github/actions/cd-azure/**"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Development
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/cd-azure
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          location: ${{ vars.AZURE_LOCATION }}
          resource-group: ${{ vars.AZURE_RESOURCE_GROUP }}
      - name: Configure internal identity secret
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          INTERNAL_IDENTITY_SECRET: ${{ secrets.INTERNAL_IDENTITY_SECRET }}
        run: |
          set -euo pipefail
          if [ ${#INTERNAL_IDENTITY_SECRET} -lt 32 ]; then
            echo "::error::INTERNAL_IDENTITY_SECRET must contain at least 32 characters"
            exit 1
          fi
          APP_NAME="$(az resource list --resource-type Microsoft.Web/sites --query "[?resourceGroup=='$AZURE_RESOURCE_GROUP' && contains(name, 'transaction')].name | [0]" --output tsv)"
          if [ -z "$APP_NAME" ]; then
            echo "::error::Transaction App Service was not found in $AZURE_RESOURCE_GROUP"
            exit 1
          fi
          az webapp config appsettings set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$APP_NAME" \
            --settings "INTERNAL_IDENTITY_SECRET=$INTERNAL_IDENTITY_SECRET" \
            --output none
      - name: Deploy transaction
        run: azd deploy transaction --no-prompt
