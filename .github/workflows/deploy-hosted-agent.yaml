name: Deploy Foundry Hosted Agent

on:
  push:
    branches:
      - main
    paths:
      - "app/backend/**"
      - "!app/backend/**/*.md"
      - ".github/workflows/deploy-hosted-agent.yaml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: hosted-agent-development
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Development
    steps:
      - uses: actions/checkout@v4
      - uses: Azure/setup-azd@v2
      - name: Install Foundry extensions
        run: azd -C app/backend ext install microsoft.foundry
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Configure azd environment
        env:
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
          FOUNDRY_PROJECT_ENDPOINT: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
          AZURE_AI_PROJECT_ID: ${{ vars.AZURE_AI_PROJECT_ID }}
          MODEL_DEPLOYMENT_NAME: ${{ vars.MODEL_DEPLOYMENT_NAME }}
          INTERNAL_IDENTITY_SECRET: ${{ secrets.INTERNAL_IDENTITY_SECRET }}
          ENABLE_INSTRUMENTATION: ${{ vars.ENABLE_INSTRUMENTATION }}
          ENABLE_SENSITIVE_DATA: ${{ vars.ENABLE_SENSITIVE_DATA }}
          AZURE_EXPERIMENTAL_ENABLE_GENAI_TRACING: ${{ vars.AZURE_EXPERIMENTAL_ENABLE_GENAI_TRACING }}
          OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: ${{ vars.OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT }}
        run: |
          set -euo pipefail
          azd -C app/backend config set auth.useAzCliAuth true
          azd -C app/backend env new development --subscription "$AZURE_SUBSCRIPTION_ID" --location "$AZURE_LOCATION" --no-prompt
          for var in AZURE_AI_PROJECT_ID FOUNDRY_PROJECT_ENDPOINT MODEL_DEPLOYMENT_NAME; do
            if [ -z "${!var}" ]; then
              echo "::error::Missing required GitHub environment variable: $var"
              exit 1
            fi
          done
          if [ ${#INTERNAL_IDENTITY_SECRET} -lt 32 ]; then
            echo "::error::INTERNAL_IDENTITY_SECRET must contain at least 32 characters"
            exit 1
          fi
          for var in AZURE_TENANT_ID AZURE_AI_PROJECT_ID FOUNDRY_PROJECT_ENDPOINT MODEL_DEPLOYMENT_NAME \
                     ENABLE_INSTRUMENTATION ENABLE_SENSITIVE_DATA \
                     AZURE_EXPERIMENTAL_ENABLE_GENAI_TRACING \
                     OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT \
                     INTERNAL_IDENTITY_SECRET; do
            azd -C app/backend env set "$var" "${!var}"
          done
      - name: Deploy hosted agent
        run: azd -C app/backend deploy home-banking-agent --no-prompt
      - name: Show agent status
        run: azd -C app/backend ai agent show --no-prompt
