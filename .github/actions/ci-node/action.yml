name: CI Node App
description: Install dependencies, lint, type-check, run tests with coverage, and build.

inputs:
  project-path:
    description: Path to the Node project.
    required: true
  node-version:
    description: Node.js version used by the project.
    required: false
    default: "22"
  artifact-name:
    description: Name of the uploaded coverage artifact.
    required: false
    default: coverage-report

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: ${{ inputs.project-path }}/package-lock.json

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.project-path }}
      run: npm ci

    - name: Run linter
      shell: bash
      working-directory: ${{ inputs.project-path }}
      run: npm run lint --if-present

    - name: Run type check
      shell: bash
      working-directory: ${{ inputs.project-path }}
      run: npm run typecheck --if-present

    - name: Run unit tests with coverage
      shell: bash
      working-directory: ${{ inputs.project-path }}
      run: npm run test -- --coverage.enabled=true --coverage.reporter=text-summary --coverage.reporter=json-summary --coverage.reporter=html

    - name: Generate Coverage Job Summary
      if: always()
      shell: bash
      working-directory: ${{ inputs.project-path }}
      run: |
        echo "### Code Coverage Summary (Vitest)" >> "$GITHUB_STEP_SUMMARY"

        if [ -f coverage/coverage-summary.json ]; then
          node -e "const fs=require('fs');const p='coverage/coverage-summary.json';const d=JSON.parse(fs.readFileSync(p,'utf8')).total;console.log('| Metric | Coverage Percentage |');console.log('| :--- | :--- |');console.log(`| **Lines** | ${d.lines.pct}% |`);console.log(`| **Statements** | ${d.statements.pct}% |`);console.log(`| **Functions** | ${d.functions.pct}% |`);console.log(`| **Branches** | ${d.branches.pct}% |`);" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "Coverage summary file not found." >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Upload coverage report artifact
      if: always()
      uses: actions/upload-artifact@v7.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.project-path }}/coverage/
        retention-days: 14
        if-no-files-found: ignore

    - name: Build application (Vite)
      shell: bash
      working-directory: ${{ inputs.project-path }}
      run: npm run build
