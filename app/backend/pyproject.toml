[project]
name = "banking-assistant-copilot-backend"
version = "0.1.0"
description = "A multi-agent orchestration exposed as chat service for banking assistant frontend"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "fastapi[all]==0.141.1",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    "azure-identity==1.25.3",
    "azure-storage-blob==12.30.3",
    "dependency-injector==4.48.1",
    "agent-framework-core==1.19.0",
    "agent-framework-openai==1.14.4",
    "agent-framework-orchestrations==1.2.0",
    "mcp>=1.24.0,<2",
    "agent-framework-chatkit==1.0.0b260910",
    "openai-chatkit==1.6.5",
    "aiohttp==3.13.5",
    "azure-monitor-opentelemetry==1.8.10",
    "opentelemetry-semantic-conventions-ai==0.5.1",
]

[tool.uv]
prerelease = "if-necessary-or-explicit"
# [tool.uv.sources]
# "agent-framework-azure" = { git = "https://github.com/microsoft/agent-framework.git", branch = "main", subdirectory = "python/packages/azure-ai" }
# "agent-framework-chatkit" = { git = "https://github.com/microsoft/agent-framework.git", branch = "main", subdirectory = "python/packages/chatkit" }
# "agent-framework-core" = { git = "https://github.com/microsoft/agent-framework.git", branch = "main", subdirectory = "python/packages/core" }

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "asgi-lifespan", "fastmcp"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
