[project]
name = "banking-assistant-agent"
version = "0.1.0"
description = "A banking assistant workflow hosted through the Foundry Responses protocol"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "fastapi[all]==0.141.1",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    "azure-identity==1.25.3",
    "agent-framework-core==1.19.0",
    "agent-framework-foundry==1.13.1",
    "agent-framework-foundry-hosting==1.0.0b260918",
    "azure-ai-agentserver-responses>=2.2.0b1,<3",
    "agent-framework-openai==1.14.4",
    "agent-framework-orchestrations==1.2.0",
    "mcp>=1.24.0,<2",
    "azure-monitor-opentelemetry==1.8.10",
    "opentelemetry-semantic-conventions-ai==0.5.1",
]

[tool.uv]
prerelease = "allow"
environments = ["sys_platform != 'emscripten'"]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
