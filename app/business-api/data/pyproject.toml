[project]
name = "banking-assistant-data"
version = "0.1.0"
description = "Schema migrations and bounded data loading for the banking assistant"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14,<2",
    "banking-shared",
    "banking-identity",
    "psycopg[binary]>=3.2,<4",
    "pwdlib[argon2]>=0.2,<1",
    "sqlmodel>=0.0.24,<1",
]

[tool.uv.sources]
banking-identity = { path = "../identity", editable = true }
banking-shared = { path = "../shared", editable = true }

[dependency-groups]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/banking_data"]
