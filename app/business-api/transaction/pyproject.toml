[project]
name = "banking-assistant-transaction-mcp"
version = "0.1.0"
description = "Python MCP server for transactions business-api using fastmcp"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "fastmcp==3.4.7",
    "pydantic==2.13.5",
    "fastapi[all]==0.141.1",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]
