# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

# azd >=1.23.7 is required for the frontend's VITE_* build-time injection (cd-frontend.yaml,
# .github/workflows/README.md#frontend-variables-cd-frontendyaml): before that release, `azd env set`
# values were passed into Docker builds and hooks only, never into non-Docker framework build
# subprocesses like `npm run build` (see https://github.com/Azure/azure-dev/issues/6903).
requiredVersions:
  azd: ">=1.23.7"

name: home-banking-assistant-python
services:
  identity:
    resourceName: ${AZURE_IDENTITY_APP_NAME}
    project: ./app/business-api/identity
    language: python
    host: appservice
    hooks:
      prepackage:
        windows:
          shell: pwsh
          run: |
            $ErrorActionPreference = 'Stop'
            if ((Test-Path ./identity) -or (Test-Path ./banking_shared)) { throw 'Package staging paths already exist' }
            Copy-Item -Recurse ./src/identity ./identity
            Copy-Item -Recurse ../shared/src/banking_shared ./banking_shared
        posix:
          shell: sh
          run: |
            set -eu
            test ! -e ./identity && test ! -e ./banking_shared
            cp -R ./src/identity ./identity
            cp -R ../shared/src/banking_shared ./banking_shared
      postpackage:
        windows:
          shell: pwsh
          run: Remove-Item -Recurse -Force ./identity, ./banking_shared
        posix:
          shell: sh
          run: rm -rf ./identity ./banking_shared
  account:
    resourceName: ${AZURE_ACCOUNT_APP_NAME}
    project: ./app/business-api/account
    language: python
    host: appservice
    hooks:
      prepackage:
        windows:
          shell: pwsh
          run: |
            $ErrorActionPreference = 'Stop'
            if ((Test-Path ./banking_account) -or (Test-Path ./banking_shared)) { throw 'Package staging paths already exist' }
            Copy-Item -Recurse ./src/banking_account ./banking_account
            Copy-Item -Recurse ../shared/src/banking_shared ./banking_shared
        posix:
          shell: sh
          run: |
            set -eu
            test ! -e ./banking_account && test ! -e ./banking_shared
            cp -R ./src/banking_account ./banking_account
            cp -R ../shared/src/banking_shared ./banking_shared
      postpackage:
        windows:
          shell: pwsh
          run: Remove-Item -Recurse -Force ./banking_account, ./banking_shared
        posix:
          shell: sh
          run: rm -rf ./banking_account ./banking_shared
  transaction:
    resourceName: ${AZURE_TRANSACTION_APP_NAME}
    project: ./app/business-api/transaction
    language: python
    host: appservice
    hooks:
      prepackage:
        windows:
          shell: pwsh
          run: |
            $ErrorActionPreference = 'Stop'
            if ((Test-Path ./banking_transaction) -or (Test-Path ./banking_shared)) { throw 'Package staging paths already exist' }
            Copy-Item -Recurse ./src/banking_transaction ./banking_transaction
            Copy-Item -Recurse ../shared/src/banking_shared ./banking_shared
        posix:
          shell: sh
          run: |
            set -eu
            test ! -e ./banking_transaction && test ! -e ./banking_shared
            cp -R ./src/banking_transaction ./banking_transaction
            cp -R ../shared/src/banking_shared ./banking_shared
      postpackage:
        windows:
          shell: pwsh
          run: Remove-Item -Recurse -Force ./banking_transaction, ./banking_shared
        posix:
          shell: sh
          run: rm -rf ./banking_transaction ./banking_shared
  responses-bff:
    resourceName: ${AZURE_RESPONSES_BFF_APP_NAME}
    project: ./app/responses-bff
    language: python
    host: appservice
    hooks:
      prepackage:
        windows:
          shell: pwsh
          run: |
            $ErrorActionPreference = 'Stop'
            if ((Test-Path ./bff) -or (Test-Path ./banking_shared)) { throw 'Package staging paths already exist' }
            Copy-Item -Recurse ./src/bff ./bff
            Copy-Item -Recurse ../business-api/shared/src/banking_shared ./banking_shared
        posix:
          shell: sh
          run: |
            set -eu
            test ! -e ./bff && test ! -e ./banking_shared
            cp -R ./src/bff ./bff
            cp -R ../business-api/shared/src/banking_shared ./banking_shared
      postpackage:
        windows:
          shell: pwsh
          run: Remove-Item -Recurse -Force ./bff, ./banking_shared
        posix:
          shell: sh
          run: rm -rf ./bff ./banking_shared
  web:
    resourceName: ${AZURE_WEB_APP_NAME}
    project: ./app/frontend/banking-web
    dist: dist
    language: js
    host: appservice
infra:
  provider: terraform
